[package]
name = "ibex-runtime"
version = "0.1.0"
edition = "2021"
description = "Ibex runtime - Hermes JS engine, module loader, and host ABI"
authors = ["Ibex Runtime Team"]
license = "MIT"

[workspace]
members = ["crates/capsec-semantics", "crates/compiled-stub", "crates/ibex2", "crates/ibex2-sqlite", "crates/sfe-catalog", "crates/sfe-format", "crates/windows-dll-staging"]
exclude = ["tools/oxc-latest-canary"]
resolver = "2"

[lib]
name = "ibex_runtime"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "ibex"
path = "src/bin/ibex/main.rs"

[[bin]]
name = "ibex-sfe-dev-pack"
path = "src/bin/ibex_sfe_dev_pack.rs"
required-features = ["sfe-dev-spike"]

[[bin]]
name = "ibex-sfe-contract"
path = "src/bin/ibex_sfe_contract.rs"
required-features = ["sfe-catalog-build"]

[[example]]
name = "module_runner_spike"
required-features = ["module-runner-spike"]

[[example]]
name = "module_runner_test262_spike"
required-features = ["module-runner-spike"]

[dependencies]
capsec-semantics = { path = "crates/capsec-semantics" }
ibex-sfe-format = { path = "crates/sfe-format" }
ibex-sfe-catalog = { path = "crates/sfe-catalog" }
# Error handling
thiserror = "1.0"
anyhow = "1.0"
tempfile = "3"

# CLI argument parsing and shell completions for the `ibex` binary.
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Random bytes for crypto
getrandom = "0.2"

# SQLite support for exact:sqlite builtin module
rusqlite = { version = "0.40.2", features = ["bundled", "column_decltype", "hooks"] }

# Module resolution (Node/ESM)
# `authenticated_module_resolve_options` disables ambient NODE_PATH lookup via
# `ResolveOptions::node_path`, which was added in oxc_resolver 11.19.1.
oxc_resolver = "=11.24.2"
oxc_ast = "=0.140.0"
oxc_ast_visit = "=0.140.0"
oxc_allocator = "=0.140.0"
oxc_codegen = "=0.140.0"
oxc_parser = "=0.140.0"
oxc_semantic = "=0.140.0"
oxc_sourcemap = "=8.1.1"
oxc_span = "=0.140.0"
oxc_transformer = "=0.140.0"

# Async trait support
async-trait = "0.1"

# Base64 for source maps
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
# Pure-Rust host for the pinned cjs-module-lexer 2.1.0 WASM detector. Disable
# WAT parsing because the checked-in authority is already compiled WASM.
wasmi = { version = "0.46.0", default-features = false, features = ["std"] }

# HTTP server host bridge
hyper = { version = "1.1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2", "server-auto", "server-graceful"] }
h2 = "0.4"
http-body-util = "0.1"
futures-util = "0.3"
socket2 = "0.6.2"
tokio-tungstenite = "0.21"

# File watching support for the `ibex` binary. The REPL editor is owned by the
# terminal-session adapter and deliberately does not use synchronous rustyline.
notify = "6.1"

# Path handling
dirs = "5.0"

# Fixture glob matching for the hidden `ibex compat` harness command
# (ENG-23081; same version the pre-split exact-cli pinned).
glob = "0.3"

# Process handling
which = "6.0"

# For FFI string handling
libc = "0.2"

# Native TLS bridge for the `tls` builtin (ENG-23492/ENG-23526): sans-IO
# rustls client engine driven from the JS event loop. `ring` provider
# (cc-compiled, no cmake/system OpenSSL) keeps the default build hermetic per
# LLP 0005; webpki-roots bundles the Mozilla CA store the way Node bundles its
# roots. @ref LLP 0004#the-tls-builtin — native bridge dependency choice
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"
webpki-roots = "0.26"
rustls-pki-types = { version = "1", features = ["std"] }

swc_common = { version = "23.0.1", features = ["sourcemap"] }
swc_ecma_ast = "25.0.0"
swc_ecma_parser = "41.0.1"
swc_ecma_codegen = "28.0.1"
swc_ecma_visit = "25.0.0"
swc_ecma_transforms_base = { version = "44.0.2", features = ["inline-helpers"] }
swc_ecma_transforms_typescript = "49.0.0"
swc_ecma_transforms_module = "49.0.0"
swc_ecma_transforms_react = "49.0.0"

# Startup-critical hashing and JSON processing run over multi-megabyte
# artifacts on every launch: the engine-binary identity digest (~8.5 MB), the
# embedded CapSec registry record (~17 MB of coverage edges + target cells,
# parsed and JCS-canonicalized during arming), and snapshot authentication. At
# the default dev opt-level 0 those phases dominated time-to-first-result for
# a trivial `ibex eval` (~3.5 s of arming on a warm run, measured 2026-07-24
# with IBEX_STARTUP_TRACE); optimized they are tens of milliseconds. Debug
# codegen for the workspace's own code is unchanged except for
# capsec-semantics, which hosts the JCS/digest inner loops. Release builds are
# unaffected. issues/20260724-insecure-startup-performance.md
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.ryu]
opt-level = 3
[profile.dev.package.itoa]
opt-level = 3
[profile.dev.package.capsec-semantics]
opt-level = 2

[features]
# LLP 0026 native module graphs are the ordinary source evaluator. The
# bounded 0.1 compatibility window retains the old bundler only for module
# shapes the authenticated v1 graph explicitly classifies as unsupported.
# tls-client-identity-openssl is default-on by design: native/CLI builds keep
# the OpenSSL PKCS#12/encrypted-PKCS#8 client-identity decoders; compile-only
# cross gates opt out with default-features = false.
#
# The default build is secure and therefore refuses before project code while
# no exact target advertisement exists. Developers may opt into
# `unadvertised-dev-arming` to exercise the sandbox without an advertisement,
# or explicitly select `insecure` when they intentionally need no sandbox.
#
# A secure development build that bypasses only target advertisement is:
#     cargo build --bin ibex --no-default-features \
#         --features standard,unadvertised-dev-arming
#
# `standard` exists so that invocation does not have to re-list the ordinary
# runtime features by hand.
# @ref LLP 0039#the-default-is-secure-and-fail-closed
default = ["standard"]
standard = ["module-runner", "tls-client-identity-openssl"]
app-host = []
# Debug/local convenience: arm and run WITHOUT a checked target advertisement so
# `ibex eval`/`repl`/`run` work before the advertisement pipeline exists. Every
# other production authenticator (loaded-engine identity, protected artifacts,
# root bindings, the full armed capability floor) still runs — only the
# report-derived target promotion is replaced with a synthetic complete cell
# map, and the synthesized default policy's root authority ceiling is raised to
# the project subtree so ambient root can read/write project files. The mount
# boundary, non-fs capabilities, and authored policies are unaffected. OFF by
# default and never in a shipped build; a loud banner marks every run.
# Compile-time so it adds no runtime environment/CLI surface.
# @ref LLP 0038#decision — scope and removal condition
# @ref LLP 0021#wp10--prove-targets-and-publish-the-conformance-report
unadvertised-dev-arming = []
# ALL security enforcement off. There is no sandbox in this build: it can read
# and write the entire filesystem, spawn processes, and reach the network.
# Implies `unadvertised-dev-arming`, and additionally (1) arms the root ceiling
# `unbounded`, (2) makes the legacy capability shim permissive, and (3) reports
# unarmed from `ex_host_is_armed()`, which sends all ~46 native gates down their
# diagnostic path. It also compiles the launcher-installed ambient projection
# that exposes the inherited host environment through `process.env`
# (issues/20260724-insecure-process-env.md). Exists so Ibex's own development
# is not blocked by a security model still being built. A red banner marks
# every run; never ship it, and never run untrusted code under it.
# @ref LLP 0038#fully-open-mode-insecure
insecure = ["unadvertised-dev-arming"]
# Fixture-only LLP 0026 adoption evidence. This compiles the bounded producer
# but never selects it as the runtime evaluator or enables artifact caching.
module-runner-spike = []
# LLP 0026 authenticated graph producer, linker, and Hermes evaluator.
module-runner = []
# Phase-0 LLP 0029 development stub. This exposes an explicitly diagnostic
# Hermes constructor and must never be used as the release compiled profile.
sfe-dev-spike = ["module-runner"]
# Deliberate dual-mode standalone runtime. This is not the ordinary CLI's
# development-only `insecure` posture; only the compiled application stub
# selects its authenticated ambient/CapSec dispatch.
# @ref LLP 0047#ambient-path
sfe-compiled-runtime = ["module-runner"]
sfe-catalog-build = []
sfe-static-network = ["dep:curl-sys"]
# LLP 0042 development-posture committed admission for UNARMED embedders
# (Exact LLP 0413 Phase 2): compiles the dev-unarmed committed prepared
# startup entry (`ibex_dev_unarmed_committed_prepared_startup_v1`) and the
# prepared graph linker it drives. The entry refuses armed Host contexts at
# construction time and names its non-production authority in every receipt;
# armed Debug remains the durable development posture (Exact LLP 0416 D3).
dev-committed-embedder = ["module-runner"]
# Compiles the hyper-based localhost HTTP server backing `exact:http` and the
# agent endpoints (the `ex_host_http_*` C symbols). App hosts and the full
# `ibex` CLI profile enable this; without it build.rs compiles no-op stubs
# instead. @ref LLP 0005#c-compilation
host-http-server = []
# Enables the observer consumed only by the exact-target CapSec executable
# recipe harness. The production decision path is unchanged; the observer is
# inert until a test explicitly scopes one terminal branch.
capsec-conformance-observer = []
# Compiles the source-linked LLP 0040 SDK conformance extension and its
# fixture-only C ABI. Ordinary Ibex artifacts contain neither the fixture
# installer nor its registry.
runtime-extension-conformance = []
# Private LLP 0517 section 10 measurement ABI. Ordinary runtime builds omit
# the declarations' implementations and exported C symbols; the Exact XCTest
# capture opts in through its isolated Apple archive build.
plan-seam-benchmark-abi = []
# Release/iOS-Simulator-only observer for the ratified Partitime carrier-cost
# lane. It substitutes only report-derived target cells plus authenticated-root
# IPv4-loopback fetch; every ordinary build omits the constructor and C++ seam.
capsec-simulator-performance-observer = []
openssl-crypto = ["dep:openssl-sys"]
# OpenSSL decodes the PKCS#12 and encrypted-PKCS#8 client identity formats.
# Keep it default-on for native/CLI builds, but explicit so compile-only cross
# gates can omit the C library when the build host cannot produce it.
tls-client-identity-openssl = ["dep:openssl"]
# Retained as a CLI scheduling profile switch. The callback symbol itself is
# always supplied by the library; the CLI registers a wake hook at runtime so
# library and integration-test link units never depend on a second symbol.
cli-notify = []

[target.'cfg(target_os = "linux")'.dependencies]
# The Linux single-file executable cannot depend on the host's libcurl ABI.
# Its release profile enables this optional dependency to build libcurl and
# OpenSSL from pinned Cargo sources and link the complete HTTP/WebSocket stack
# into the stub. Ordinary Linux source-runtime builds continue to use the
# distro libcurl selected by build.rs.
# @ref LLP 0047#the-linux-ambient-network-gap-must-be-decided-not-inherited
curl-sys = { version = "=0.4.90", default-features = false, features = ["static-curl", "ssl", "static-ssl"], optional = true }

[target.'cfg(not(any(target_os = "ios", target_os = "tvos")))'.dependencies]
openssl-sys = { version = "0.9", features = ["vendored"], optional = true }
# rustls remains the wire TLS implementation. OpenSSL is used only to decode
# the PKCS#12 and encrypted-PKCS#8 identity formats required by Node's `pfx`
# and `passphrase` client options; vendoring keeps that parser hermetic across
# desktop targets.
# @ref LLP 0004#the-tls-builtin — scoped identity decoding, not wire TLS/trust.
openssl = { version = "0.10.81", features = ["vendored"], optional = true }

# Hardware SHA-256 on aarch64 (Apple Silicon, aarch64 Linux/Android). The
# default sha2 build uses the portable software backend, measured at
# ~0.5 GB/s against ~3 GB/s for the ARMv8 crypto extensions on the same
# machine; committed-publication admission hashes ~20 MB per blog-scale
# startup and this one feature took that admission from 155 ms to 104 ms
# (issues/20260730-committed-admission-cost-profile.md). Feature
# unification applies it to every workspace crate's sha2 (arming/JCS
# digests included). Digest OUTPUTS are identical by construction — only
# the compression-function implementation changes. Gated off Windows:
# sha2-asm does not support the MSVC toolchain, so Windows keeps the
# portable backend.
[target.'cfg(all(target_arch = "aarch64", not(target_os = "windows")))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[target.'cfg(windows)'.dependencies]
# Windows does not ship a C zlib development package. Build zlib from source so
# the native deflate/inflate host functions can be registered deterministically.
libz-sys = { version = "1.1", features = ["static"] }
windows-sys = { version = "0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_LibraryLoader", "Win32_System_SystemServices"] }

[build-dependencies]
base64 = "0.22"
cc = "1.0"
# Build-time precompute of the armed registry-record JCS digest so warm
# startups can authenticate the pinned artifact without re-canonicalizing
# ~17 MB of JSON. Uses the same canonicalization code as the runtime, so the
# digest is byte-identical by construction.
# issues/20260724-insecure-startup-performance.md
capsec-semantics = { path = "crates/capsec-semantics" }
ibex-windows-dll-staging = { path = "crates/windows-dll-staging" }
libc = "0.2"
serde = "1.0"
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"

[patch.crates-io]
# ring 0.17.14 emits its recursive rerun-if-changed set in filesystem order.
# Cargo fingerprints directive order, so equivalent clean builders otherwise
# produce distinct Rust metadata and final SFE bytes. The vendored upstream
# code is exact apart from sorting that traversal.
# @ref LLP 0047#4-milestone-1--publish-a-real-release-catalog
ring = { path = "vendor/ring" }

[dev-dependencies]
libc = "0.2"
sha1 = "0.10"

# LLP 0013 Goal 3 steady-state overhead benchmark. `harness = false` because the
# unit of work is a whole `ibex` subprocess (not an in-process microbenchmark),
# so the bench provides its own warmup + median-of-N `main` rather than using
# criterion. @ref LLP 0013#goals
[[bench]]
name = "compartment_overhead"
harness = false

# Broad subprocess wall-clock comparison for local Hermes shell vs Ibex CLI
# variants. Complements `compartment_overhead`: this captures startup/bootstrap
# and user-visible CLI mode costs for plain JS workloads, while that bench
# isolates the LLP 0013 hot interpreter-path guard.
[[bench]]
name = "runtime_compare"
harness = false

[[bench]]
name = "startup_performance"
harness = false

[[bench]]
name = "capsec_descriptor_authorization"
harness = false
